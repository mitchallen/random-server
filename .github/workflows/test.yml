name: test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Cucumber tests
        run: npm test

  # The publish workflows only run on `v*` tags, so without this job a broken
  # Dockerfile or build script would not surface until release time. Builds the
  # image and smoke-tests the container; never pushes.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the Docker image
        run: docker build -t random-server:ci .

      - name: Smoke test the container
        run: |
          set -euo pipefail
          docker run -d --name rs-ci -p 3100:3100 random-server:ci

          # Wait for the server to accept connections, failing loudly if it
          # never does (a crash-looping container would otherwise just hang).
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3100/ >/dev/null; then break; fi
            if [ "$i" = "30" ]; then
              echo "container never became ready; logs:" >&2
              docker logs rs-ci >&2
              exit 1
            fi
            sleep 1
          done

          curl -sf http://localhost:3100/ | grep -q '"status":"OK"'
          curl -sf http://localhost:3100/v1/people/1 | grep -q '"type":"people"'

          # Assert on strings from the route docs in src/openapi.ts, not just
          # "openapi", so the check fails if the paths/schemas go missing.
          curl -sf http://localhost:3100/api-docs/swagger-ui-init.js > spec.js
          grep -q 'Get the service status' spec.js
          grep -q 'ssnFour' spec.js
          grep -q '#/components/schemas/Person' spec.js
          echo "container smoke test passed"

      - name: Container logs
        if: always()
        run: docker logs rs-ci || true
